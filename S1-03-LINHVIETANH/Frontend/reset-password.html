<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Đặt lại mật khẩu tài khoản">
    <title>Đặt lại mật khẩu - Hệ thống quản lý</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <!-- Animated background -->
        <div class="bg-decoration">
            <div class="bg-circle bg-circle-1"></div>
            <div class="bg-circle bg-circle-2"></div>
            <div class="bg-circle bg-circle-3"></div>
        </div>

        <div class="auth-card" id="resetPasswordCard">
            <!-- Header -->
            <div class="auth-header">
                <div class="auth-logo">
                    <span class="logo-icon">🔑</span>
                </div>
                <h1 class="auth-title">Đặt lại mật khẩu</h1>
                <p class="auth-subtitle">Nhập mật khẩu mới cho tài khoản của bạn</p>
            </div>

            <!-- Reset Password Form -->
            <form id="resetPasswordForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="newPassword" class="form-label">Mật khẩu mới</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="newPassword" class="form-input" 
                               placeholder="Nhập mật khẩu mới (ít nhất 6 ký tự)" required
                               autocomplete="new-password">
                        <button type="button" class="toggle-password" onclick="togglePassword('newPassword', this)">
                            👁️
                        </button>
                    </div>
                    <span class="form-error" id="newPasswordError"></span>
                    <div class="password-strength" id="passwordStrength">
                        <div class="strength-bar">
                            <div class="strength-fill" id="strengthFill"></div>
                        </div>
                        <span class="strength-text" id="strengthText"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Xác nhận mật khẩu</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="confirmPassword" class="form-input" 
                               placeholder="Nhập lại mật khẩu mới" required
                               autocomplete="new-password">
                        <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', this)">
                            👁️
                        </button>
                    </div>
                    <span class="form-error" id="confirmPasswordError"></span>
                </div>

                <button type="submit" class="btn btn-primary" id="resetButton">
                    <span class="btn-text">Đặt lại mật khẩu</span>
                    <span class="btn-loader" style="display:none;">
                        <span class="spinner"></span>
                    </span>
                </button>

                <!-- Alert message -->
                <div id="resetAlert" class="alert" style="display:none;"></div>
            </form>

            <!-- Success state -->
            <div id="resetSuccess" class="success-state" style="display:none;">
                <div class="success-icon">🎉</div>
                <h2 class="success-title">Đặt lại mật khẩu thành công!</h2>
                <p class="success-message">
                    Mật khẩu của bạn đã được thay đổi. Bạn có thể đăng nhập bằng mật khẩu mới.
                </p>
                <a href="index.html" class="btn btn-primary" style="text-decoration:none; display:inline-block; margin-top:20px; text-align:center;">
                    Đăng nhập
                </a>
            </div>

            <!-- Error state (token hết hạn / không hợp lệ) -->
            <div id="resetError" class="error-state" style="display:none;">
                <div class="error-icon">⚠️</div>
                <h2 class="error-title" id="resetErrorTitle">Liên kết không hợp lệ</h2>
                <p class="error-message" id="resetErrorMessage">
                    Liên kết đặt lại mật khẩu đã hết hạn hoặc không hợp lệ.
                </p>
                <a href="forgot-password.html" class="btn btn-secondary" style="text-decoration:none; display:inline-block; margin-top:20px; text-align:center;">
                    Yêu cầu liên kết mới
                </a>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Đọc token và email từ URL
        const urlParams = new URLSearchParams(window.location.search);
        const resetToken = urlParams.get('token');
        const resetEmail = urlParams.get('email');

        // Kiểm tra có token và email trong URL không
        if (!resetToken || !resetEmail) {
            // Không có token/email - hiện lỗi
            document.getElementById('resetPasswordForm').style.display = 'none';
            document.getElementById('resetError').style.display = 'block';
            document.getElementById('resetErrorTitle').textContent = 'Liên kết không hợp lệ';
            document.getElementById('resetErrorMessage').textContent = 
                'Liên kết đặt lại mật khẩu không hợp lệ. Vui lòng yêu cầu một liên kết mới.';
        }

        // Password strength indicator
        document.getElementById('newPassword').addEventListener('input', function() {
            updatePasswordStrength(this.value);
        });

        function updatePasswordStrength(password) {
            const fill = document.getElementById('strengthFill');
            const text = document.getElementById('strengthText');
            let strength = 0;
            
            if (password.length >= 6) strength++;
            if (password.length >= 8) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;

            const levels = [
                { width: '0%', color: '#e0e0e0', text: '' },
                { width: '20%', color: '#ff4444', text: 'Rất yếu' },
                { width: '40%', color: '#ff8800', text: 'Yếu' },
                { width: '60%', color: '#ffcc00', text: 'Trung bình' },
                { width: '80%', color: '#88cc00', text: 'Mạnh' },
                { width: '100%', color: '#00cc44', text: 'Rất mạnh' }
            ];

            const level = levels[strength];
            fill.style.width = level.width;
            fill.style.backgroundColor = level.color;
            text.textContent = level.text;
            text.style.color = level.color;
        }

        // Submit reset password
        document.getElementById('resetPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const button = document.getElementById('resetButton');
            const alert = document.getElementById('resetAlert');

            // Reset errors
            clearErrors();

            // Validate
            let valid = true;

            if (!newPassword) {
                showFieldError('newPasswordError', 'Vui lòng nhập mật khẩu mới.');
                valid = false;
            } else if (newPassword.length < 6) {
                showFieldError('newPasswordError', 'Mật khẩu phải có ít nhất 6 ký tự.');
                valid = false;
            } else if (!/[A-Z]/.test(newPassword)) {
                showFieldError('newPasswordError', 'Mật khẩu phải có ít nhất 1 chữ hoa.');
                valid = false;
            } else if (!/[a-z]/.test(newPassword)) {
                showFieldError('newPasswordError', 'Mật khẩu phải có ít nhất 1 chữ thường.');
                valid = false;
            } else if (!/[0-9]/.test(newPassword)) {
                showFieldError('newPasswordError', 'Mật khẩu phải có ít nhất 1 chữ số.');
                valid = false;
            }

            if (!confirmPassword) {
                showFieldError('confirmPasswordError', 'Vui lòng xác nhận mật khẩu.');
                valid = false;
            } else if (newPassword !== confirmPassword) {
                showFieldError('confirmPasswordError', 'Mật khẩu xác nhận không khớp.');
                valid = false;
            }

            if (!valid) return;

            // Submit
            setLoading(button, true);
            hideAlert(alert);

            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: resetEmail,
                        token: resetToken,
                        newPassword: newPassword
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // Thành công
                    document.getElementById('resetPasswordForm').style.display = 'none';
                    document.getElementById('resetSuccess').style.display = 'block';
                } else {
                    // Token hết hạn hoặc không hợp lệ hoặc đã sử dụng
                    if (data.message && (
                        data.message.includes('hết hạn') || 
                        data.message.includes('không hợp lệ') ||
                        data.message.includes('đã được sử dụng')
                    )) {
                        document.getElementById('resetPasswordForm').style.display = 'none';
                        document.getElementById('resetError').style.display = 'block';
                        document.getElementById('resetErrorMessage').textContent = data.message;
                    } else {
                        showAlert(alert, data.message || 'Có lỗi xảy ra. Vui lòng thử lại.', 'error');
                    }
                }
            } catch (error) {
                showAlert(alert, 'Không thể kết nối đến máy chủ.', 'error');
            } finally {
                setLoading(button, false);
            }
        });
    </script>
</body>
</html>
