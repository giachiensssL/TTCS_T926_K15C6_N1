<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Đăng ký tài khoản mới">
    <title>Đăng ký - Hệ thống quản lý</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="bg-decoration">
            <div class="bg-circle bg-circle-1"></div>
            <div class="bg-circle bg-circle-2"></div>
            <div class="bg-circle bg-circle-3"></div>
        </div>

        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <span class="logo-icon">📝</span>
                </div>
                <h1 class="auth-title">Đăng ký</h1>
                <p class="auth-subtitle">Tạo tài khoản mới</p>
            </div>

            <form id="registerForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="regFullName" class="form-label">Họ tên</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="regFullName" class="form-input" 
                               placeholder="Nhập họ tên" required autocomplete="name">
                    </div>
                    <span class="form-error" id="regFullNameError"></span>
                </div>

                <div class="form-group">
                    <label for="regEmail" class="form-label">Email</label>
                    <div class="input-wrapper">
                        <span class="input-icon">📧</span>
                        <input type="email" id="regEmail" class="form-input" 
                               placeholder="Nhập email" required autocomplete="email">
                    </div>
                    <span class="form-error" id="regEmailError"></span>
                </div>

                <div class="form-group">
                    <label for="regPassword" class="form-label">Mật khẩu</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="regPassword" class="form-input" 
                               placeholder="Ít nhất 6 ký tự, 1 chữ hoa, 1 chữ số" required
                               autocomplete="new-password">
                        <button type="button" class="toggle-password" onclick="togglePassword('regPassword', this)">
                            👁️
                        </button>
                    </div>
                    <span class="form-error" id="regPasswordError"></span>
                </div>

                <button type="submit" class="btn btn-primary" id="registerButton">
                    <span class="btn-text">Đăng ký</span>
                    <span class="btn-loader" style="display:none;">
                        <span class="spinner"></span>
                    </span>
                </button>

                <div id="registerAlert" class="alert" style="display:none;"></div>
            </form>

            <div class="auth-footer">
                <p>Đã có tài khoản? <a href="index.html" class="auth-link">Đăng nhập</a></p>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const fullName = document.getElementById('regFullName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const button = document.getElementById('registerButton');
            const alert = document.getElementById('registerAlert');

            clearErrors();
            let valid = true;

            if (!fullName) { showFieldError('regFullNameError', 'Vui lòng nhập họ tên.'); valid = false; }
            if (!email) { showFieldError('regEmailError', 'Vui lòng nhập email.'); valid = false; }
            else if (!isValidEmail(email)) { showFieldError('regEmailError', 'Email không hợp lệ.'); valid = false; }
            if (!password) { showFieldError('regPasswordError', 'Vui lòng nhập mật khẩu.'); valid = false; }
            else if (password.length < 6) { showFieldError('regPasswordError', 'Mật khẩu phải có ít nhất 6 ký tự.'); valid = false; }

            if (!valid) return;

            setLoading(button, true);
            hideAlert(alert);

            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert(alert, 'Đăng ký thành công! Đang chuyển đến trang đăng nhập...', 'success');
                    setTimeout(() => { window.location.href = 'index.html'; }, 2000);
                } else {
                    showAlert(alert, data.message || 'Đăng ký thất bại.', 'error');
                }
            } catch (error) {
                showAlert(alert, 'Không thể kết nối đến máy chủ.', 'error');
            } finally {
                setLoading(button, false);
            }
        });
    </script>
</body>
</html>
