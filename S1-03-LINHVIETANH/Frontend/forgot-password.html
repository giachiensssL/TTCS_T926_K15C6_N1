<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Quên mật khẩu - Yêu cầu đặt lại mật khẩu">
    <title>Quên mật khẩu - Hệ thống quản lý</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <!-- Animated background -->
        <div class="bg-decoration">
            <div class="bg-circle bg-circle-1"></div>
            <div class="bg-circle bg-circle-2"></div>
            <div class="bg-circle bg-circle-3"></div>
        </div>

        <div class="auth-card" id="forgotPasswordCard">
            <!-- Header -->
            <div class="auth-header">
                <div class="auth-logo">
                    <span class="logo-icon">📧</span>
                </div>
                <h1 class="auth-title">Quên mật khẩu</h1>
                <p class="auth-subtitle">Nhập email để nhận hướng dẫn đặt lại mật khẩu</p>
            </div>

            <!-- Forgot Password Form -->
            <form id="forgotPasswordForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="forgotEmail" class="form-label">Email</label>
                    <div class="input-wrapper">
                        <span class="input-icon">📧</span>
                        <input type="email" id="forgotEmail" class="form-input" 
                               placeholder="Nhập email đã đăng ký" required autocomplete="email">
                    </div>
                    <span class="form-error" id="forgotEmailError"></span>
                </div>

                <button type="submit" class="btn btn-primary" id="forgotButton">
                    <span class="btn-text">Gửi yêu cầu đặt lại mật khẩu</span>
                    <span class="btn-loader" style="display:none;">
                        <span class="spinner"></span>
                    </span>
                </button>

                <!-- Alert message -->
                <div id="forgotAlert" class="alert" style="display:none;"></div>
            </form>

            <!-- Success state (hiện sau khi gửi thành công) -->
            <div id="forgotSuccess" class="success-state" style="display:none;">
                <div class="success-icon">✅</div>
                <h2 class="success-title">Yêu cầu đã được gửi</h2>
                <p class="success-message">
                    Nếu email tồn tại trong hệ thống, bạn sẽ nhận được hướng dẫn đặt lại mật khẩu.
                </p>
                <p class="success-hint">
                    Vui lòng kiểm tra hộp thư đến (và thư mục spam) của bạn.
                </p>
            </div>

            <div class="auth-footer">
                <p><a href="index.html" class="auth-link">← Quay lại đăng nhập</a></p>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('forgotEmail').value.trim();
            const button = document.getElementById('forgotButton');
            const alert = document.getElementById('forgotAlert');

            // Reset errors
            clearErrors();

            // Validate
            if (!email) {
                showFieldError('forgotEmailError', 'Vui lòng nhập email.');
                return;
            }
            if (!isValidEmail(email)) {
                showFieldError('forgotEmailError', 'Email không hợp lệ.');
                return;
            }

            // Submit
            setLoading(button, true);
            hideAlert(alert);

            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (response.ok) {
                    // Ẩn form, hiện success state
                    document.getElementById('forgotPasswordForm').style.display = 'none';
                    document.getElementById('forgotSuccess').style.display = 'block';
                } else {
                    showAlert(alert, data.message || 'Có lỗi xảy ra. Vui lòng thử lại.', 'error');
                }
            } catch (error) {
                showAlert(alert, 'Không thể kết nối đến máy chủ.', 'error');
            } finally {
                setLoading(button, false);
            }
        });
    </script>
</body>
</html>
